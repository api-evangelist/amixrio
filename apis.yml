name: Amixr.io
description: Amixr was an incident-response and on-call management startup that provided alerting,
  escalation, and on-call scheduling for engineering and DevOps teams, integrating with monitoring
  stacks such as Grafana and Prometheus. Backed by 500 Global, the company was acquired by Grafana
  Labs in December 2021 and its product was folded into Grafana OnCall (now part of Grafana IRM). The
  standalone amixr.io product and developer surface have been retired; the domain no longer serves an
  active website, developer portal, or API. This profile is retained in the API Evangelist network as
  a historical company record following enrichment.
